name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make test
      - run: make build/query_bench
      - run: python3 bench/compare.py --rows 100 --repetitions 2
  undefined-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make test CXXFLAGS='-O1 -g -std=c++20 -Wall -Wextra -Wpedantic -Werror -pthread -fsanitize=undefined -fno-sanitize-recover=all'
